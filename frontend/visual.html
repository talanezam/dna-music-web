<body>

<div class="main-wrapper">

        <button class="genova-download-btn" onclick="downloadGenovaCanvas('fractal-container', 'Genomic_Star')">Download📥</button>

<h2 class="macro-panel-title">The Genomic Tree of Life:
     A Macro-Scale Synthesis of DNA Expression</h2>



    <div id="master-panel-container" style="width: 85%; height: 650px;
     background: #220132;
     border: 2px solid #824597;
     box-shadow: 0 0 25px rgb(160, 94, 207);
     margin-top: 12px;
     margin-bottom: 30px;
     display: block;
     clear: both;
     box-sizing: border-box;">

    <canvas id="masterGeneticCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
</div>


<button class="genova-download-btn macro-download-btn" onclick="downloadGenovaCanvas('master-panel-container', 'Genomic_Tree_of_Life')">Download 📥</button>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="js/app1.js"> </script>

    
<script >function downloadGenovaCanvas(containerId, fileName) {
    const container = document.getElementById(containerId);
    if (!container) return;

    // البحث عن عنصر الكانفاس الحقيقي بداخل الديف
    const canvas = container.tagName.toLowerCase() === 'canvas' ? container : container.querySelector('canvas');

    if (!canvas) {
        alert("اللوحة جاري معالجتها بالوقت الفعلي، يرجى الانتظار ثانية ثم المحاولة!");
        return;
    }

    // التقاط محتوى اللوحة وتحويله لصورة PNG
    const imageURL = canvas.toDataURL("image/png");

    // إطلاق عملية التنزيل التلقائي بجهازكِ
    const vLink = document.createElement("a");
    vLink.href = imageURL;
    vLink.download =` ${fileName}_GENOVA.png`; 

    document.body.appendChild(vLink);
    vLink.click(); 
    document.body.removeChild(vLink); 
}
</script>

    </body>
</html>
