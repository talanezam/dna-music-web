// دالة بتحول الثواني لشكل توقيت مفهوم (مثلاً 65 ثانية بتصير 1:05)
function formatTime(seconds) {
    if (!seconds || seconds < 0) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
}
// ===== Simple Cinematic Reverb =====
const reverb = audioCtx.createConvolver();
const reverbGain = audioCtx.createGain();
reverbGain.gain.value = 0.35;

function createImpulseResponse(duration = 2.5, decay = 2.0) {
  const sampleRate = audioCtx.sampleRate;
  const length = sampleRate * duration;
  const impulse = audioCtx.createBuffer(2, length, sampleRate);

  for (let channel = 0; channel < 2; channel++) {
    const data = impulse.getChannelData(channel);
    for (let i = 0; i < length; i++) {
      data[i] =
        (Math.random() * 2 - 1) *
        Math.pow(1 - i / length, decay);
    }
  }

  return impulse;
}

reverb.buffer = createImpulseResponse();
reverb.connect(reverbGain);
reverbGain.connect(audioCtx.destination);

function setupRecorder() {

function playNote(freq, duration = 0.28, volume = 0.85) {
    isPlaying = true;
  if (!Number.isFinite(freq)) return; // حماية من undefined / NaN

  const now = audioCtx.currentTime;
const preset = INSTRUMENT_PRESETS[INSTRUMENT] || INSTRUMENT_PRESETS["CINE"];
console.log("Current instrument:", INSTRUMENT);
console.log("Preset loaded:", preset);
const useSub = preset.useSub ?? true;
  // MAIN + DETUNE (يعطي سماكة بدون حدة مزعجة)
  const osc = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();

  osc.type = preset.wave1;
osc2.type = preset.wave2;

  osc.frequency.setValueAtTime(freq, now);
  osc2.frequency.setValueAtTime(freq, now);
  osc2.detune.setValueAtTime(preset.detune, now);
  // SUB (Bass) خفيف لتخانة “سينمائية”
  const sub = audioCtx.createOscillator();
  sub.type = "sine";
  sub.frequency.setValueAtTime(freq / 2, now);

  // فلتر Low-pass لكسر الزمور/الحدة
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  // cutoff ذكي: كل ما النغمة أعلى، الفلتر أعلى
const cutoff = Math.min(2200, Math.max(900, freq * preset.cutoffMul));
  filter.frequency.setValueAtTime(cutoff, now);

  // Gain stages
  const mix = audioCtx.createGain();   // قبل الفلتر
  const amp = audioCtx.createGain();   // بعد الفلتر (Envelope)

  // خلط الطبقات (وازنّاهم)
  const subGain = audioCtx.createGain();
  subGain.gain.setValueAtTime(0.07, now); // تخانة بدون بَحّة (غيري 0.12 - 0.25)

  osc.connect(mix);
  osc2.connect(mix);
  sub.connect(subGain);
  subGain.connect(mix);

  mix.connect(filter);
  filter.connect(amp);
 amp.connect(audioCtx.destination); // الصوت المباشر
amp.connect(reverb); // إرسال جزء للريڤيرب

  // Envelope ناعم (سينمائي) + بدون قطع مفاجئ
 amp.gain.setValueAtTime(0.0001, now);
 amp.gain.setValueAtTime(0.0001, now);
amp.gain.exponentialRampToValueAtTime(volume, now + preset.attack);
amp.gain.exponentialRampToValueAtTime(0.0001, now + duration + preset.release);
  osc.start(now);
  osc2.start(now);

  osc.stop(now + duration);
  osc2.stop(now + duration);
 if (useSub) {
  sub.start(now);
  sub.stop(now + duration);
}
}

async function playNotes() {
isPlaying=true;
    await audioCtx.resume();
    timeouts.forEach(clearTimeout);
timeouts = [];
// أخذ النوتات وتكرارها 3 مرات (مثل ما بيسمعها المستخدم تماماً)
const notes = window.lastNotes || [];
const repeats = 3; 
const loopedNotes = Array(repeats).fill(notes).flat();

    if (!notes.length) {
        alert("اعملي Send أول شي");
        return;
    }


const freqMap = {
  "C4": 261.63,
  "Eb4": 311.13,
  "F4": 349.23,
  "Gb4": 369.99,
  "G4": 392.00,
  "Bb4": 466.16,
  "C5": 523.25,
  "Eb5": 622.25
};
    

let t = 0;

loopedNotes.forEach((note, index) => {

  // تطبيع النوتة ليتناسب مع السلم
  const normalizeNote = {
    "D4": "Eb4",
    "E4": "F4",
    "A4": "Bb4",
    "B4": "C5",
  };

  note = normalizeNote[note] || note;

  // جيب التردد مع حماية من undefined
  let finalFreq = freqMap[note] ?? freqMap["C4"];

  // ===== إيقاع سينمائي متغيّر =====
 const base  = 0.22;  

  const beat =
    (index % 8 === 0) ? 0.12 :
    (index % 4 === 0) ? 0.07 :
    0.3;

  const duration = base + beat;
  // ترابط بسيط بين النغمات
  const overlap = 0.01;
const progression = index / loopedNotes.length;
const dynamicVolume = 0.65 + progression * 0.6;
 
const id = setTimeout(() => {
  if (!isPlaying) return;
  playNote(finalFreq, duration, dynamicVolume);
}, t);

timeouts.push(id);

  t += Math.max(18, (duration - overlap) * 1000);
});

}

  // دالة تحويل البيانات لصوت - نسخة مختصرة ومجربة
function bufferToWave(abuffer, len) {
    let numOfChan = abuffer.numberOfChannels,
        length = len * numOfChan * 2 + 44,
        buffer = new ArrayBuffer(length),
        view = new DataView(buffer),
        channels = [], i, sample, offset = 0, pos = 0;

    function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
    setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
    setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

    for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
    while (pos < len) {
        for (i = 0; i < numOfChan; i++) {
            sample = Math.max(-1, Math.min(1, channels[i][pos]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            view.setInt16(44 + offset, sample, true); offset += 2;
        }
        pos++;
    }
    return new Blob([buffer], { type: "audio/wav" });







}

// دالة التحميل

async function downloadMusic() {
    // 1. فحص وجود البيانات
    if (!window.lastNotes || window.lastNotes.length === 0) {
        alert("Please generate DNA notes first!");
        return;
    }

    document.getElementById("statusText").textContent = "Processing Audio...";

    try {
        const baseNotes = window.lastNotes;
        const notes = Array(3).fill(baseNotes).flat(); 
        const sampleRate = 44100;
        const durationPerNote = 0.45;
        const totalDuration = notes.length * durationPerNote;

        // 2. إنشاء السياق الأوفلاين
        const renderCtx = new OfflineAudioContext(2, Math.ceil(sampleRate * totalDuration), sampleRate);

        // 3. إعدادات الآلة الحالية
        const preset = INSTRUMENT_PRESETS[INSTRUMENT] || INSTRUMENT_PRESETS["CINE"];
        const freqMap = { "C4": 261.63, "Eb4": 311.13, "F4": 349.23, "Gb4": 369.99, "G4": 392.00, "Bb4": 466.16, "C5": 523.25, "Eb5": 622.25 };

        let currentTime = 0;

        notes.forEach((noteName) => {
            const freq = freqMap[noteName] || 261.63;
            
            const osc = renderCtx.createOscillator();
            const osc2 = renderCtx.createOscillator();
            const amp = renderCtx.createGain();
            const filter = renderCtx.createBiquadFilter();

            osc.type = preset.wave1;
            osc2.type = preset.wave2;
            osc.frequency.setValueAtTime(freq, currentTime);
            osc2.frequency.setValueAtTime(freq, currentTime);
            osc2.detune.setValueAtTime(preset.detune, currentTime);

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(Math.min(2000, freq * 2), currentTime);

            amp.gain.setValueAtTime(0.0001, currentTime);
            amp.gain.exponentialRampToValueAtTime(0.5, currentTime + 0.05);
            amp.gain.exponentialRampToValueAtTime(0.0001, currentTime + 0.4);

            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(amp);
            amp.connect(renderCtx.destination);

            osc.start(currentTime);
            osc2.start(currentTime);
            osc.stop(currentTime + 0.4);
            osc2.stop(currentTime + 0.4);

            currentTime += durationPerNote;
        });

        // 4. الرندرة وتحويلها لملف
        const renderedBuffer = await renderCtx.startRendering();
        
        // استخدام الدالة اللي عندك لتحويل البافر لـ Wave
        const blob = bufferToWave(renderedBuffer, renderedBuffer.length);
        
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download =` DNA_Music_${INSTRUMENT}.wav`;
        document.body.appendChild(a); // إضافة الزر للجسم لضمان عمله في بعض المتصفحات
        a.click();
        document.body.removeChild(a);
        
        document.getElementById("statusText").textContent = "Success! Downloaded.";

    } catch (err) {
        console.error("Download failed:", err);
        document.getElementById("statusText").textContent = "Download failed. Check console.";
    }
}


/**
 * Genetic Flower: Soft Mandala Edition
 * النسخة المعتمدة: بتلات مستديرة ناعمة مع تدرجات لونية عميقة
 */

function drawGeneticFlower() {
    const canvas = document.getElementById('dnaCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // إعدادات الحجم
    const displayDiv = document.querySelector('.visual-display');
    canvas.width = displayDiv.clientWidth || 600;
    canvas.height = displayDiv.clientHeight || 550;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    // جلب بيانات الـ DNA
    const dna = localStorage.getItem("userDNA") || "ATGCATGCATGCATGCATGC";
    const countT = (dna.match(/T/g) || []).length;
    const countG = (dna.match(/G/g) || []).length;

    // المعايير الجينية
    const basePetals = Math.max(countT, 10); 
    const scaleFactor = 1 + (countG * 0.03);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // مصفوفة الطبقات (الألوان المعتمدة بالترتيب من الخارج للداخل)
    const layers = [
        { color: '#fbbf24', dark: '#78350f', size: 200, count: basePetals },      // 1. ذهبي خارجي
        { color: '#4c1d95', dark: '#1e1b4b', size: 170, count: basePetals + 2 },  // 2. نهدي غامق
        { color: '#db2777', dark: '#500724', size: 140, count: basePetals },      // 3. زهري مطفي
        { color: '#166534', dark: '#052e16', size: 110, count: basePetals + 4 },  // 4. أخضر غامق
        { color: '#4ade80', dark: '#064e3b', size: 80,  count: 12 },              // 5. أخضر فاتح
        { color: '#2dd4bf', dark: '#134e4a', size: 50,  count: 8 }                // 6. قلب الوردة
    ];

    layers.forEach((layer) => {
        const numPetals = layer.count;
        const petalLen = layer.size * scaleFactor;
        const petalWidth = (petalLen * 0.45); // عرض البتلة ليعطي استدارة

        for (let i = 0; i < numPetals; i++) {
            const angle = (i / numPetals) * Math.PI * 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // تدرج لوني يعطي مظهر "الطبقات"
            const grad = ctx.createLinearGradient(0, 0, 0, -petalLen);
            grad.addColorStop(0, layer.dark);
            grad.addColorStop(0.7, layer.color);
            grad.addColorStop(1, layer.color);

            ctx.beginPath();
            ctx.fillStyle = grad;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';

            ctx.moveTo(0, 0);
            // رسم البتلة بمنحنيات ناعمة جداً (Bezier)
            // 
            ctx.bezierCurveTo(petalWidth, -petalLen/3, petalWidth, -petalLen, 0, -petalLen);
            ctx.bezierCurveTo(-petalWidth, -petalLen, -petalWidth, -petalLen/3, 0, 0);
            
            ctx.fill();
            ctx.restore();
        }
    });

    // المركز المضيء (Core)
    drawSoftCore(ctx, cx, cy);
}

function drawSoftCore(ctx, cx, cy) {
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.3, '#2dd4bf');
    coreGrad.addColorStop(1, 'transparent');

    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();
}
// تفعيل الأزرار عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', () => {
    const tabs = document.querySelectorAll('.visual-tab');

    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            // 1. إزالة التفعيل من كل الأزرار وإضافته للمختار
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');

            // 2. معرفة أي نمط تم اختياره
            const pattern = this.getAttribute('data-pattern');
            console.log("النمط المختار حالياً:", pattern);

            // 3. إذا كان المختار هو الوردة، نفذ الرسم
            if (pattern === 'flower') {
                drawGeneticFlower();
            } else {
                // هنا يمكن إضافة دوال الرسم الأخرى (Tree, Crystal... إلخ)
                console.log("سيتم رسم نمط آخر قريباً...");
            }
        });
    });
});

</script>
