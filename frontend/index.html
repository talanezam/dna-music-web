<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Genomic Identity System – Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Genomic Identity System</h1>

<p class="subtitle">
Enter a DNA sequence manually or upload a DNA file, then choose the desired project path.
</p>
<div class="dna-card">
  <div class="controls">

    <div class="row">
      <input type="text" id="dnaInput" placeholder="Enter DNA Sequence" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" />
  <input type="file" id="dnaFile" accept=".txt" style="display:none">
  <button id="uploadDNA" type="button">📁 Upload DNA File</button>
</div>

    <div class="row">
  <button id="sendBtn" type="button">Generate</button>
  <button id="randomBtn" type="button">🎲 Random DNA</button>
  <button id="clearBtn" type="button" class="icon-btn">🗑</button>
</div>

    <div class="row">
  <button id="loadBtn" type="button">📂 Load DNA</button>
</div>
</div>
    <hr>

    <h2>Choose Project Path</h2>

    <div class="row">
      <button id="artisticPathBtn" type="button">Artistic Path</button>
      <button id="scientificPathBtn" type="button">Scientific Path</button>
    </div>

  </div>

  <pre id="result"></pre>

  <script>
  sessionStorage.removeItem("dnaReady"); 

  window.addEventListener('pageshow', (event) => {
    const dnaInput = document.getElementById("dnaInput");
    
    // التحقق إذا كان نوع الدخول للصفحة هو "إعادة تحميل" (Reload/Refresh)
    const isRefresh = performance.getEntriesByType("navigation")[0].type === "reload";

    if (isRefresh && dnaInput) {
        dnaInput.value = ""; // يصفر فقط في حالة الريفريش
        sessionStorage.removeItem("dnaReady"); // يقفل المسارات في حالة الريفريش
    }
});

document.getElementById("artisticPathBtn").addEventListener("click", () => {
  const ready = sessionStorage.getItem("dnaReady");

  if (ready !== "true") {
    alert("Please generate DNA first.");
    return;
  }

  window.location.href = "artistic.html";
});

document.getElementById("scientificPathBtn").addEventListener("click", () => {
  const ready = sessionStorage.getItem("dnaReady");

  if (ready !== "true") {
    alert("Please generate DNA first.");
    return;
  }

  window.location.href = "scientific.html";
});
async function sendDNA() {
  const btn = document.getElementById("sendBtn");
  const dnaValue = document.getElementById("dnaInput").value.trim().toUpperCase();

  try {
    if (!dnaValue) {
      alert("Please enter a DNA sequence first.");
      return;
    }

   sessionStorage.setItem("savedDNA", dnaValue);

    const response = await fetch("http://127.0.0.1:8000/api/echo-dna", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dna: dnaValue })
    });

    const data = await response.json();

    if (!response.ok) {
      alert(data.detail || "Error occurred.");
      return;
    }
document.getElementById("result").textContent =
    "DNA processed successfully";
    sessionStorage.setItem("dnaReady", "true");
  } catch (error) {
    alert("Cannot connect to backend.");
    console.error(error);
  } 
}

    document.getElementById("loadBtn").addEventListener("click", () => {
     const savedDNA = sessionStorage.getItem("savedDNA");
      if (savedDNA) {
        document.getElementById("dnaInput").value = savedDNA;
        document.getElementById("result").textContent = "DNA loaded successfully.";
      }
    });

    document.getElementById("randomBtn").addEventListener("click", () => {
      const len = 60;
      const chars = ["A", "C", "G", "T"];
      let s = "";

      for (let i = 0; i < len; i++) {
        s += chars[Math.floor(Math.random() * 4)];
      }

      document.getElementById("dnaInput").value = s;document.getElementById("result").textContent = "Random DNA sequence generated successfully.";
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("dnaInput").value = "";
      document.getElementById("result").textContent = "";
      localStorage.removeItem("dnaReady");
    });
document.getElementById("dnaFile").addEventListener("change", function(event){

  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const dna = e.target.result.trim().toUpperCase();

    const validDNA = /^[ACGT\s]+$/;

    if (!validDNA.test(dna)) {
        alert("The selected file contains invalid DNA characters. Only A, C, G, and T are allowed.");
        return;
    }

    document.getElementById("dnaInput").value = dna.replace(/\s+/g, "");
};

  reader.readAsText(file);

});
document.getElementById("uploadDNA").addEventListener("click", () => {
  document.getElementById("dnaFile").click();
});
   document.getElementById("dnaInput").addEventListener("input", function(){

  let value = this.value.toUpperCase();

  value = value.replace(/[^ACGT]/g, "");

  this.value = value;

});

document.getElementById("sendBtn").addEventListener("click", sendDNA);
window.addEventListener("load", () => {
  const savedDNA = sessionStorage.getItem("savedDNA");
  if (savedDNA) {
    document.getElementById("dnaInput").value = savedDNA;
  }
});
  </script>
<hr>

</p>

</footer>
</body>
</html>
