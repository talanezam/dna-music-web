<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Genomic Identity System – Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>DNA Music Generator</h1>

  <div class="controls">

    <div class="row">
      <input type="text" id="dnaInput" placeholder="Enter DNA Sequence" />
    </div>

    <div class="row">
      <button id="sendBtn" type="button">Generate</button>
    </div>

    <div class="row">
      <button id="randomBtn">🎲 Random DNA</button>
      <button id="loadBtn">📂 Load DNA</button>
    </div>

    <div class="row">
      <button id="clearBtn" class="icon-btn">🗑</button>
    </div>

    <hr>

    <h2>Choose Project Path</h2>

    <div class="row">
      <button id="artisticPathBtn">Artistic Path</button>
      <button id="scientificPathBtn">Scientific Path</button>
    </div>

  </div>

  <pre id="result"></pre>

  <script>
   document.getElementById("artisticPathBtn").addEventListener("click", () => {
  const dnaValue = document.getElementById("dnaInput").value.trim().toUpperCase();

  if (dnaValue) {
    localStorage.setItem("savedDNA", dnaValue);
  }

  window.open("artistic.html", "_blank");
});

document.getElementById("scientificPathBtn").addEventListener("click", () => {
  const dnaValue = document.getElementById("dnaInput").value.trim().toUpperCase();

  if (dnaValue) {
    localStorage.setItem("savedDNA", dnaValue);
  }

  window.open("scientific.html", "_blank");
});
    async function sendDNA() {
      const dnaValue = document.getElementById("dnaInput").value.trim().toUpperCase();

      if (!dnaValue) {
        document.getElementById("result").textContent = "Please enter a DNA sequence.";
        return;
      }

      localStorage.setItem("savedDNA", dnaValue);

      try {
        const response = await fetch("http://127.0.0.1:8000/api/echo-dna", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dna: dnaValue })
        });

        const data = await response.json();

        if (!response.ok) {
          document.getElementById("result").textContent = data.detail || "Error occurred.";
          return;
        }

        document.getElementById("result").textContent =
          "DNA saved successfully\\n" +
          "Length: " + data.length + "\\n" +
          "Cleaned: " + data.cleaned;
      } catch (error) {
        document.getElementById("result").textContent = "Cannot connect to backend.";
        console.error(error);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendDNA);

    document.getElementById("loadBtn").addEventListener("click", () => {
      const savedDNA = localStorage.getItem("savedDNA");
      if (savedDNA) {
        document.getElementById("dnaInput").value = savedDNA;
        document.getElementById("result").textContent = "DNA loaded successfully.";
      }
    });

    document.getElementById("randomBtn").addEventListener("click", () => {
      const len = 60;
      const chars = ["A", "C", "G", "T"];
      let s = "";

      for (let i = 0; i < len; i++) {
        s += chars[Math.floor(Math.random() * 4)];
      }

      document.getElementById("dnaInput").value = s;
      document.getElementById("result").textContent = "Random DNA generated.";
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("dnaInput").value = "";
      document.getElementById("result").textContent = "";
    });

   
  </script>
</body>
</html>
