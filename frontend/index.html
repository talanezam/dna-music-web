<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <title>Genomic Identity System – Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">

  <header class="header-section">
    <h1 class="main-title">Genova</h1>
    <h3 class="main-subtitle">Genetic Identity System</h3>
    
  </header>

  <div class="input-area">
    <p class="subtitle">Enter your DNA sequence or upload a file then click Generate.</p>
      <div class="row">
        <input type="text" id="dnaInput" placeholder="Enter DNA Sequence" autocomplete="off" spellcheck="false">
        <input type="file" id="dnaFile" accept=".txt" style="display:none">
        <button id="uploadDNA" type="button">📁 Upload DNA File</button>
      </div>

      <div class="row">
        <button id="sendBtn" type="button" class="generate-btn">Generate</button>
        <button id="clearBtn" type="button" class="icon-btn">🗑</button>
      </div>
      
      <div id="statusMessage"></div>
  </div>


  <hr class="section-divider">

<section class="results-section">
    <div class="results-header-top-left">
        <h2 class="main-results-title">DNA TRANSLATION RESULTS</h2>
    </div>

    <div class="portals-center-wrapper">
        
        <button class="mega-portal-btn glow-permanent" id="scientificPathBtn">
            Guide to Your Biometric Indicators
        </button>

        <button class="mega-portal-btn glow-permanent" id="artisticPathBtn">
            Discover Your Musical Identity
        </button>

    </div>
</section>
 <section class="random-section-v3">
    <div class="pill-container">
        <p class="pill-text">
            No DNA data? Don't worry. Click the button to generate a sequence.
        </p>
        <button class="pill-button" id="randomBtn">
           <span>🎲</span>
            Try Random DNA
        </button>
    </div>
</section>

  <footer>
      <p>
          <a href="about.html">About</a> |
          <a href="contact.html">Contact</a> |
          <a href="privacy.html">Privacy</a>
      </p>
  </footer>


  <script>
    window.addEventListener('load', () => {
      const navEntries = performance.getEntriesByType("navigation");
      if (navEntries.length > 0 && navEntries[0].type === "reload") {
        localStorage.removeItem("userDNA");
        localStorage.removeItem("dnaReady");
        document.getElementById("dnaInput").value = "";
        document.getElementById("statusMessage").textContent = "Page reset due to refresh.";
      } else {
        const savedDNA = localStorage.getItem("userDNA");
        if (savedDNA) {
          document.getElementById("dnaInput").value = savedDNA;
        }
      }
    });

    async function sendDNA() {
      const dnaValue = document.getElementById("dnaInput").value.trim().toUpperCase();
      if (!dnaValue) {
        alert("Please enter a DNA sequence first.");
        return;
      }
      localStorage.setItem("userDNA", dnaValue);
      localStorage.setItem("dnaReady", "true");
      try {
        const response = await fetch("http://127.0.0.1:8000/api/echo-dna", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dna: dnaValue })
        });
        if (response.ok) {
          document.getElementById("statusMessage").textContent = "DNA processed successfully";
        } else {
          const data = await response.json();
          alert(data.detail || "Error occurred.");
        }
      } catch (error) {
        alert("Cannot connect to backend.");
      }
    }

    document.getElementById("artisticPathBtn").addEventListener("click", () => {
      if (localStorage.getItem("dnaReady") === "true") {
        window.location.href = "artistic.html";
      } else {
        alert("Please generate DNA first.");
      }
    });

    document.getElementById("scientificPathBtn").addEventListener("click", () => {
      if (localStorage.getItem("dnaReady") === "true") {
        window.location.href = "scientific.html";
      } else {
        alert("Please generate DNA first.");
      }
    });
    // هلق رح يشتغل لأن الزر صار فوقه وموجود!
    document.getElementById("randomBtn").addEventListener("click", () => {
      const len = 60;
      const chars = ["A", "C", "G", "T"];
      let s = "";
      for (let i = 0; i < len; i++) {
        s += chars[Math.floor(Math.random() * 4)];
      }
      document.getElementById("dnaInput").value = s;
      document.getElementById("statusMessage").textContent = "Random DNA selected successfully.";
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("dnaInput").value = "";
      document.getElementById("statusMessage").textContent = "";
      localStorage.removeItem("userDNA");
      localStorage.removeItem("dnaReady");
    });

    document.getElementById("uploadDNA").addEventListener("click", () => {
      document.getElementById("dnaFile").click();
    });

    document.getElementById("dnaFile").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const dna = e.target.result.trim().toUpperCase();
        if (/^[ACGT\s]+$/.test(dna)) {
          document.getElementById("dnaInput").value = dna.replace(/\s+/g, "");
          document.getElementById("statusMessage").textContent = "File loaded successfully.";
        } else {
          alert("Invalid DNA file content.");
        }
      };
      reader.readAsText(file);
    });

    

    document.getElementById("sendBtn").addEventListener("click", sendDNA);

    document.getElementById("dnaInput").addEventListener("input", function() {
      this.value = this.value.toUpperCase().replace(/[^ACGT]/g, "");
    });
  </script>

</body>
</html>
